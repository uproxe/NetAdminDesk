# Сборка, тесты и установщики NetAdmin Desk для Windows, macOS и Linux.
# Установщики собираются только здесь, на «родных» раннерах каждой ОС.
# Пакеты Linux (.deb, .rpm, .pacman, AppImage) дополнительно ставятся в чистых контейнерах дистрибутивов.
# Подписи сертификатами разработчика нет — см. docs/BUILD.md.
name: build

# Название запуска в списке Actions: для выпуска — «Выпуск релиза vX.Y.Z», для обычной проверки —
# заголовок коммита (пустое значение = название по умолчанию).
run-name: >-
  ${{ inputs.version && format('Выпуск релиза v{0}', inputs.version)
  || startsWith(github.ref, 'refs/tags/v') && format('Выпуск релиза {0}', github.ref_name)
  || github.event_name == 'workflow_dispatch' && 'Проверка вручную'
  || '' }}

on:
  push:
    # dev — рабочая ветка: изменения проверяются в ней, а в main попадают одним коммитом на версию
    branches: [main, master, dev]
    tags: ['v*']
  pull_request:
  # Кнопка «Run workflow» во вкладке Actions. С номером версии — выпуск релиза без git на компьютере:
  # ничего не собирается заново — берутся готовые установщики из зелёной проверки этого коммита в main.
  workflow_dispatch:
    inputs:
      version:
        description: 'Выпустить релиз: впишите номер версии из файла VERSION (например, 1.5.0). Пусто — просто проверка.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  # Скрипты установки пакетов не выполняются: Electron для упаковки скачивает electron-builder,
  # а необязательная нативная часть ssh2 не нужна (используется реализация на JavaScript).
  NPM_INSTALL: npm install --ignore-scripts --no-audit --no-fund

jobs:
  test:
    name: Тесты (Linux)
    # При выпуске релиза ничего не собирается заново
    if: ${{ !inputs.version && !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: ${{ env.NPM_INSTALL }}
      - name: Модульные тесты (драйвер node:sqlite)
        run: npm test
      - name: Тесты базы на sql.js (драйвер приложения)
        run: npm run test:sqljs
      - name: Проверка типов
        # Сборка (esbuild) не зависит от проверки типов, поэтому ошибки типов показываются, но не блокируют установщики.
        continue-on-error: true
        run: npm run typecheck
      - name: Сборка
        run: npm run build
      - name: Отчёт импорта TXT
        run: npm run import-report -- --out import-report.md
      - uses: actions/upload-artifact@v6
        with:
          name: import-report
          path: import-report.md

  ssh-integration:
    name: SSH против OpenSSH (docker)
    # При выпуске релиза ничего не собирается заново
    if: ${{ !inputs.version && !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    env:
      NAD_SSH_HOST: 127.0.0.1
      NAD_SSH_PORT: '2222'
      NAD_SSH_USER: nad
      # Одноразовый пароль тестового контейнера, существующего только во время CI.
      NAD_SSH_PASS: nad-ci-only-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: ${{ env.NPM_INSTALL }}
      - name: Запуск тестового sshd
        run: |
          docker build -t nad-sshd - <<'DOCKERFILE'
          FROM debian:stable-slim
          RUN apt-get update && apt-get install -y --no-install-recommends openssh-server \
           && rm -rf /var/lib/apt/lists/* && mkdir -p /run/sshd \
           && useradd -m -s /bin/bash nad && echo 'nad:nad-ci-only-password' | chpasswd \
           && printf 'PasswordAuthentication yes\nAllowTcpForwarding yes\n' > /etc/ssh/sshd_config.d/ci.conf
          CMD ["/usr/sbin/sshd", "-D", "-e"]
          DOCKERFILE
          docker run -d --name sshd -p 2222:22 nad-sshd
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/2222) 2>/dev/null && break; sleep 1; done
      - name: Интеграционные тесты SSH
        run: npm run test:ssh
      - name: Журнал sshd
        if: always()
        run: docker logs sshd || true

  package:
    name: Установщик ${{ matrix.name }}
    # При выпуске релиза ничего не собирается заново
    if: ${{ !inputs.version && !startsWith(github.ref, 'refs/tags/v') }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS собирается отдельным заданием package-mac: релиз его не ждёт
          - name: Windows x64
            os: windows-latest
            builder: --win nsis --x64
            artifact: NetAdminDesk-Windows-x64-Setup.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: ${{ env.NPM_INSTALL }}
      - run: npm run build
      - name: Сборка установщика
        run: npx electron-builder ${{ matrix.builder }} --publish never
        env:
          # Автоматический поиск сертификатов отключён: сборка без подписи разработчика.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Проверка имени файла
        shell: bash
        run: |
          ls -la release
          test -f "release/${{ matrix.artifact }}"

      # ---- Самопроверка собранного приложения (--smoke-test) ----
      - name: Самопроверка (Windows, установка NSIS в тихом режиме)
        timeout-minutes: 8
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NETADMIN_DESK_DATA = "$env:RUNNER_TEMP\nad-data"
          $env:NAD_SMOKE_OUT = "$env:RUNNER_TEMP\smoke.json"
          $setup = Start-Process -FilePath "release\${{ matrix.artifact }}" -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Установщик завершился с кодом $($setup.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\NetAdmin Desk\NetAdmin Desk.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter *.exe | Select-Object -First 20 FullName; throw 'Приложение не найдено после установки' }
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -Wait -PassThru
          Get-Content $env:NAD_SMOKE_OUT
          if ($p.ExitCode -ne 0) { throw "Самопроверка не пройдена: код $($p.ExitCode)" }
      - name: NetLoom — загрузка отклоняется при неверной контрольной сумме или адресе
        timeout-minutes: 10
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Тот же сценарий, что встроен в установщик, запускается той же Windows PowerShell 5.1
          $defs = @{}
          Get-Content build\netloom.nsh | ForEach-Object { if ($_ -match '^!define (\w+) "([^"]*)"') { $defs[$Matches[1]] = $Matches[2] } }
          $out = "$env:RUNNER_TEMP\netloom-test.exe"
          $ps = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          & $ps -NoProfile -NonInteractive -ExecutionPolicy Bypass -File build\netloom-install.ps1 -Url $defs.NETLOOM_URL -Sha256 ('0' * 64) -Out $out -ExpectedBytes $defs.NETLOOM_BYTES
          if ($LASTEXITCODE -ne 3) { throw "Ожидался код 3 (сумма не совпала), получен $LASTEXITCODE" }
          if (Test-Path $out) { throw 'Файл с неверной суммой не удалён' }
          & $ps -NoProfile -NonInteractive -ExecutionPolicy Bypass -File build\netloom-install.ps1 -Url 'https://github.com/uproxe/NetLoom/releases/download/v0.0.0/none.exe' -Sha256 $defs.NETLOOM_SHA256 -Out $out
          if ($LASTEXITCODE -ne 2) { throw "Ожидался код 2 (не удалось скачать), получен $LASTEXITCODE" }
          if (Test-Path $out) { throw 'Недокачанный файл не удалён' }
          & $ps -NoProfile -NonInteractive -ExecutionPolicy Bypass -File build\netloom-install.ps1 -Url 'http://github.com/' -Sha256 $defs.NETLOOM_SHA256 -Out $out
          if ($LASTEXITCODE -ne 4) { throw "Ожидался код 4 (адрес не https), получен $LASTEXITCODE" }
          Write-Host 'Отказы работают.'
          # Последний вызов намеренно вернул код 4 — без явного выхода GitHub счёл бы шаг упавшим
          exit 0
      - name: NetLoom — тихая установка вместе с NetAdmin Desk (/S /NETLOOM=1)
        timeout-minutes: 15
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = (Select-String -Path build\netloom.nsh -Pattern '^!define NETLOOM_VERSION "([^"]*)"').Matches[0].Groups[1].Value
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\NetLoom'
          if (Test-Path $key) { throw 'NetLoom уже стоит на раннере — проверка была бы неточной' }
          $setup = Start-Process -FilePath "release\${{ matrix.artifact }}" -ArgumentList '/S', '/NETLOOM=1' -Wait -PassThru
          $log = Join-Path $env:TEMP 'NetAdminDesk-NetLoom.log'
          Write-Host "--- журнал $log ---"
          if (Test-Path $log) { Get-Content $log -Encoding Unicode } else { Write-Host '(журнала нет — до установки NetLoom дело не дошло)' }
          Write-Host '---'
          if ($setup.ExitCode -ne 0) { throw "Установщик завершился с кодом $($setup.ExitCode)" }
          $got = (Get-ItemProperty $key -ErrorAction SilentlyContinue).DisplayVersion
          if ($got -ne $ver) { throw "NetLoom $ver не установлен (в списке программ: '$got')" }
          $dir = (Get-ItemProperty $key).InstallLocation
          if (-not (Test-Path (Join-Path $dir 'netloom.exe'))) { throw "Нет $dir\netloom.exe" }
          Write-Host "NetLoom $got установлен в $dir"
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\NetAdmin Desk\NetAdmin Desk.exe'))) { throw 'NetAdmin Desk пропал после повторной установки' }
      - name: Удаление программы удаляет данные, а обновление — нет
        timeout-minutes: 10
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $data = Join-Path $env:APPDATA 'NetAdmin Desk'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\NetAdmin Desk'
          New-Item -ItemType Directory -Force -Path (Join-Path $data 'backups') | Out-Null
          Set-Content -Path (Join-Path $data 'netadmin.db') -Value 'проверка'
          # Повторная установка поверх — как обновление: старый деинсталлятор идёт с --updated, данные остаются
          $p = Start-Process -FilePath "release\${{ matrix.artifact }}" -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Установщик завершился с кодом $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $data 'netadmin.db'))) { throw 'Повторная установка удалила данные — так быть не должно' }
          Write-Host 'Повторная установка данные сохранила.'
          $un = Get-ChildItem $dir -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (-not $un) { throw "Нет деинсталлятора в $dir" }
          # _?= — деинсталлятор работает на месте и не возвращает управление раньше времени
          $p = Start-Process -FilePath $un.FullName -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Деинсталлятор завершился с кодом $($p.ExitCode)" }
          if (Test-Path $data) { Get-ChildItem $data -Recurse | Select-Object -First 10 FullName; throw 'Данные остались после удаления программы' }
          if (Test-Path (Join-Path $dir 'NetAdmin Desk.exe')) { throw 'Программа не удалилась' }
          Write-Host 'Удаление программы удалило и её данные.'
      - name: Снимок шага «Дополнительно» (для просмотра)
        timeout-minutes: 5
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          # NetLoom уже установлен предыдущим шагом — удаляем, чтобы увидеть шаг с галочкой
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\NetLoom'
          if (Test-Path $key) { Start-Process -FilePath (Join-Path (Get-ItemProperty $key).InstallLocation 'uninstall.exe') -ArgumentList '/S' -Wait }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $shell = New-Object -ComObject WScript.Shell
          $p = Start-Process -FilePath "release\${{ matrix.artifact }}" -PassThru
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class Win { public struct RECT { public int L, T, R, B; } [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r); }'
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $p.Refresh()
            $r = New-Object Win+RECT
            if ($p.MainWindowHandle -ne 0 -and [Win]::GetWindowRect($p.MainWindowHandle, [ref]$r)) { $b = New-Object System.Drawing.Rectangle $r.L, $r.T, ($r.R - $r.L), ($r.B - $r.T) }
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:RUNNER_TEMP\installer-$name.png")
          }
          Start-Sleep 5; [void]$shell.AppActivate($p.Id); Shot '1-start'
          # «Только для меня» → «Далее», папка → «Далее», дальше — шаг «Дополнительно»
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}'); Start-Sleep 3; Shot '2'
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}'); Start-Sleep 3; Shot '3-extra'
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Windows'
        continue-on-error: true
        with:
          name: installer-screenshots
          path: ${{ runner.temp }}/installer-*.png
          if-no-files-found: ignore
      - name: Контрольная сумма
        shell: bash
        run: |
          cd release
          if command -v sha256sum >/dev/null; then sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"; else shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"; fi
          cat "${{ matrix.artifact }}.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/${{ matrix.artifact }}
            release/${{ matrix.artifact }}.sha256
          if-no-files-found: error

  # macOS — отдельно: GitHub часто подолгу не выделяет машину macOS (с ноября 2026). Выпуск релиза
  # её не ждёт; если .dmg собран позже (после «Re-run failed jobs»), его добавит задание attach-mac.
  package-mac:
    name: Установщик macOS Universal
    # При выпуске релиза ничего не собирается заново
    if: ${{ !inputs.version && !startsWith(github.ref, 'refs/tags/v') }}
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ARTIFACT: NetAdminDesk-macOS-Universal.dmg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: ${{ env.NPM_INSTALL }}
      - run: npm run build
      - name: Сборка установщика
        run: npx electron-builder --mac dmg --universal --publish never
        env:
          # Автоматический поиск сертификатов отключён: сборка без подписи разработчика.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Проверка имени файла
        run: |
          ls -la release
          test -f "release/$ARTIFACT"
      - name: Самопроверка (приложение из .dmg)
        timeout-minutes: 8
        run: |
          MNT=$(hdiutil attach -nobrowse -readonly "release/$ARTIFACT" | awk -F'\t' '/\/Volumes\//{print $NF}' | tail -1)
          echo "Смонтировано: $MNT"
          cp -R "$MNT/NetAdmin Desk.app" "$RUNNER_TEMP/"
          hdiutil detach "$MNT"
          APP="$RUNNER_TEMP/NetAdmin Desk.app"
          echo "Архитектуры:"; lipo -archs "$APP/Contents/MacOS/NetAdmin Desk"
          lipo -archs "$APP/Contents/MacOS/NetAdmin Desk" | grep -q x86_64
          lipo -archs "$APP/Contents/MacOS/NetAdmin Desk" | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$APP"
          export NETADMIN_DESK_DATA="$RUNNER_TEMP/nad-data" NAD_SMOKE_OUT="$RUNNER_TEMP/smoke.json"
          "$APP/Contents/MacOS/NetAdmin Desk" --smoke-test
          cat "$NAD_SMOKE_OUT"
      - name: Контрольная сумма
        run: |
          cd release
          shasum -a 256 "$ARTIFACT" > "$ARTIFACT.sha256"
          cat "$ARTIFACT.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: NetAdminDesk-macOS-Universal.dmg
          path: |
            release/NetAdminDesk-macOS-Universal.dmg
            release/NetAdminDesk-macOS-Universal.dmg.sha256
          if-no-files-found: error

  package-linux:
    name: Пакеты Linux amd64 (deb, rpm, pacman, AppImage)
    # При выпуске релиза ничего не собирается заново
    if: ${{ !inputs.version && !startsWith(github.ref, 'refs/tags/v') }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FILES: netadmindesk-linux-amd64.deb netadmindesk-linux-amd64.rpm netadmindesk-linux-amd64.pacman netadmindesk-linux-amd64.AppImage
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: ${{ env.NPM_INSTALL }}
      - run: npm run build
      - name: Инструменты для .rpm и .pacman
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools xvfb
      - name: Сборка пакетов
        run: npx electron-builder --linux --x64 --publish never
      - name: Проверка имён файлов
        run: |
          ls -la release
          for f in $FILES; do test -f "release/$f" || { echo "::error::нет release/$f"; exit 1; }; done
      - name: Самопроверка .deb (установка на этом раннере)
        timeout-minutes: 8
        run: |
          sudo apt-get install -y ./release/netadmindesk-linux-amd64.deb
          export NETADMIN_DESK_DATA="$RUNNER_TEMP/nad-data" NAD_SMOKE_OUT="$RUNNER_TEMP/smoke.json"
          # --no-sandbox только для CI: на раннерах Ubuntu 24.04 AppArmor ограничивает пространства имён.
          timeout 180 xvfb-run -a netadmindesk --smoke-test --no-sandbox
          cat "$NAD_SMOKE_OUT"
      - name: Самопроверка AppImage
        timeout-minutes: 8
        run: |
          chmod +x release/netadmindesk-linux-amd64.AppImage
          # Распаковка во временную папку вместо монтирования: FUSE в CI не нужен
          export APPIMAGE_EXTRACT_AND_RUN=1 NETADMIN_DESK_DATA="$RUNNER_TEMP/nad-data-appimage" NAD_SMOKE_OUT="$RUNNER_TEMP/smoke-appimage.json"
          timeout 180 xvfb-run -a ./release/netadmindesk-linux-amd64.AppImage --smoke-test --no-sandbox
          cat "$NAD_SMOKE_OUT"
      - name: Контрольные суммы
        run: |
          mkdir -p upload
          cd release
          for f in $FILES; do sha256sum "$f" > "$f.sha256"; cp "$f" "$f.sha256" ../upload/; cat "$f.sha256"; done
      - uses: actions/upload-artifact@v6
        with:
          name: NetAdminDesk-Linux-packages
          path: upload/*
          if-no-files-found: error

  linux-install:
    name: Установка в ${{ matrix.name }}
    needs: package-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Debian 13, image: 'debian:13', format: deb }
          - { name: Ubuntu 24.04, image: 'ubuntu:24.04', format: deb }
          - { name: Fedora, image: 'fedora:latest', format: rpm }
          - { name: Rocky Linux 9, image: 'rockylinux/rockylinux:9', format: rpm }
          - { name: openSUSE Tumbleweed, image: 'opensuse/tumbleweed', format: rpm }
          - { name: Arch Linux, image: 'archlinux:latest', format: pacman }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: NetAdminDesk-Linux-packages
          path: pkg
      - name: Установка пакета и самопроверка
        run: |
          docker run --rm --shm-size=1g -v "$PWD/pkg:/pkg:ro" -v "$PWD/scripts:/ci:ro" \
            "${{ matrix.image }}" bash /ci/ci-linux-install.sh "${{ matrix.format }}"

  # Выпуск релиза: по кнопке (номер версии) или тегу v*. Ничего не собирает — берёт готовые и уже
  # проверенные установщики из зелёной проверки этого же коммита в main (scripts/ci-release-source.sh).
  release:
    name: Публикация релиза
    if: ${{ inputs.version || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Два запуска кнопки подряд не выпустят релиз дважды
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Проверки перед выпуском
        id: ver
        env:
          WANT: ${{ inputs.version }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          VERSION="$(tr -d ' \r\n' < VERSION)"
          PKG="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            [ "$TAG" = "v$VERSION" ] || fail "Тег $TAG не совпадает с версией $VERSION в файле VERSION"
          else
            [ "$GITHUB_REF" = refs/heads/main ] || fail "Релиз выпускается только из ветки main"
            WANT="$(tr -d ' ' <<<"${WANT#v}")"
            [ "$WANT" = "$VERSION" ] || fail "Вписана версия $WANT, а в файле VERSION — $VERSION"
            TAG="v$VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              fail "Тег $TAG уже есть — эта версия уже выпущена. Поднимите версию в VERSION, package.json и CHANGELOG.md."
            fi
          fi
          [ "$VERSION" = "$PKG" ] || fail "Версия в VERSION ($VERSION) и в package.json ($PKG) не совпадает"
          grep -q "^## \[$VERSION\]" CHANGELOG.md || fail "В CHANGELOG.md нет раздела [$VERSION]"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Выпуск $TAG из коммита $GITHUB_SHA"
      - name: Готовые установщики из зелёной проверки этого коммита
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if ! RUN="$(bash scripts/ci-release-source.sh)"; then
            echo "::error::Для коммита ${SHA:0:7} в main нет зелёной проверки (пройти должно всё, кроме macOS). Дождитесь, пока во вкладке Actions закончится проверка этого коммита, и запустите выпуск снова."
            exit 1
          fi
          echo "Файлы берутся из проверки https://github.com/$REPO/actions/runs/$RUN"
          gh run download "$RUN" -R "$REPO" -p 'NetAdminDesk-*' -D downloaded
          mkdir -p dist-release
          find downloaded -type f -exec mv -t dist-release {} +
          ls -la dist-release
          for f in NetAdminDesk-Windows-x64-Setup.exe netadmindesk-linux-amd64.deb netadmindesk-linux-amd64.rpm netadmindesk-linux-amd64.pacman netadmindesk-linux-amd64.AppImage; do
            test -f "dist-release/$f" || { echo "::error::В проверке $RUN нет файла $f"; exit 1; }
          done
          # Контрольные суммы сверяются ещё раз перед публикацией
          (cd dist-release && sha256sum -c ./*.sha256)
      - name: Текст релиза из CHANGELOG.md
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Раздел «## [X.Y.Z] — дата» до следующего заголовка версии
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::В CHANGELOG.md нет раздела [$VERSION]"
            exit 1
          fi
          {
            echo
            echo '---'
            echo
            echo '**Установщики:** Windows x64 (`.exe`), macOS Universal — Intel и Apple Silicon (`.dmg`).'
            echo
            if [ ! -f dist-release/NetAdminDesk-macOS-Universal.dmg ]; then
              # Строку уберёт задание attach-mac, когда добавит .dmg
              echo '**macOS:** установщик появится в этом релизе позже — его сборка ждёт свободную машину GitHub.'
              echo
            fi
            echo '**Linux amd64:** `.deb` — Debian, Ubuntu, Mint, Astra Linux; `.rpm` — Fedora, RHEL, Rocky, Alma, openSUSE, РЕД ОС, РОСА; `.pacman` — Arch, Manjaro; `.AppImage` — любой дистрибутив без установки. Рядом с каждым файлом — `.sha256` с контрольной суммой.'
            echo
            echo 'Сборки не подписаны сертификатами разработчика: Windows SmartScreen и macOS Gatekeeper покажут предупреждение при первом запуске — как запустить, см. [docs/BUILD.md](https://github.com/${{ github.repository }}/blob/${{ steps.ver.outputs.tag }}/docs/BUILD.md#неподписанные-сборки).'
          } >> release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          # Для кнопки тег создаётся здесь, на этом коммите (тег от GITHUB_TOKEN не запускает сборку повторно)
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NetAdmin Desk ${{ steps.ver.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          files: dist-release/*

  # Сборка macOS прошла позже выпуска (например, после ночного «Re-run failed jobs» в проверке этого
  # коммита) — .dmg добавляется в уже выпущенный релиз этой версии, если он сделан из этого же коммита.
  attach-mac:
    name: Установщик macOS — в уже выпущенный релиз
    needs: package-mac
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: VERSION
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v6
        with:
          name: NetAdminDesk-macOS-Universal.dmg
          path: mac
      - name: Добавить .dmg в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d ' \r\n' < VERSION)"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Релиза $TAG ещё нет — .dmg войдёт в него при выпуске."; exit 0
          fi
          TAGSHA="$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)"
          [ -n "$TAGSHA" ] || TAGSHA="$(git ls-remote origin "refs/tags/$TAG" | cut -f1)"
          if [ "$TAGSHA" != "$GITHUB_SHA" ]; then
            echo "Релиз $TAG выпущен из другого коммита — не трогаю."; exit 0
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx NetAdminDesk-macOS-Universal.dmg; then
            echo "В релизе $TAG уже есть .dmg."; exit 0
          fi
          gh release upload "$TAG" mac/NetAdminDesk-macOS-Universal.dmg mac/NetAdminDesk-macOS-Universal.dmg.sha256 --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          if grep -q '^\*\*macOS:\*\* установщик появится' notes.md; then
            grep -v '^\*\*macOS:\*\* установщик появится' notes.md > notes-new.md
            gh release edit "$TAG" --notes-file notes-new.md --repo "$GITHUB_REPOSITORY"
          fi
          echo "Установщик macOS добавлен в релиз $TAG"
